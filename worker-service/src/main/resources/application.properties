spring.application.name=worker-service

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=15s
spring.rabbitmq.listener.simple.retry.stateless=true

spring.datasource.url=jdbc:postgresql://localhost:5432/mailpulse
spring.datasource.username=mailpulse
spring.datasource.password=mailpulse
spring.jpa.hibernate.ddl-auto=validate

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
